# Codemagic Configuration File
# YouTubiliDanmaku - iOS 越狱插件 (Theos) 自动编译
# 文档: https://docs.codemagic.io/yaml/yaml-getting-started/

workflows:
  youTubili-danmaku:
    name: YouTubiliDanmaku Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      # 环境变量
      vars:
        # Theos 安装路径
        THEOS_PATH: "/Users/builder/theos"
        # SDK 版本（Codemagic 环境自带 Xcode，从中提取 SDK）
        SDK_VERSION: "iPhoneOS16.5.sdk"
        # 目标架构 (修改为仅 arm64 以避免 fakeroot arm64e 兼容性问题)
        ARCHS: "arm64"
        # deb 包版本号
        PACKAGE_VERSION: "1.0.0"

      # 使用 Xcode 最新版本（用于提取 iPhone SDK）
      xcode: latest

    # 触发条件：push 到任意分支、打 tag、PR
    triggering:
      events:
        - push
        - pull_request
        - tag
      branch_patterns:
        - pattern: main
          include: true
        - pattern: master
          include: true
        - pattern: develop
          include: true
        - pattern: release/*
          include: true
      cancel_previous_builds: true

    # 缓存 Theos，加速后续构建
    cache:
      cache_paths:
        - $THEOS_PATH

    # 构建脚本
    scripts:
      # ========== 步骤 1: 安装依赖 ==========
      - name: Install dependencies
        script: |
          #!/bin/bash
          set -e
          echo "=== [1/6] 安装系统依赖 ==="

          # 安装 Homebrew（如果不存在）
          if ! command -v brew &> /dev/null; then
            echo "安装 Homebrew..."
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi

          # 安装基础编译工具
          brew install ldid dpkg || true
          brew install perl || true

          # ========== 更新 fakeroot 以解决架构兼容性问题 ==========
          echo "=== 更新 fakeroot ==="
          # 1. 卸载旧版本以避免架构冲突缓存
          echo "卸载旧版 fakeroot..."
          brew uninstall --ignore-dependencies fakeroot || true
          
          # 2. 清理 Homebrew 缓存，确保下载最新版本
          echo "清理 Homebrew 缓存..."
          brew cleanup --prune=all -s || true
          
          # 3. 安装最新版本
          echo "安装最新版 fakeroot..."
          brew install fakeroot || brew link --overwrite fakeroot || true

          # 4. 验证安装和版本信息
          if command -v fakeroot &> /dev/null; then
            echo "✅ fakeroot 安装成功"
            echo "   版本: $(fakeroot -v)"
            echo "   路径: $(which fakeroot)"
            # 检查二进制文件架构
            echo "   架构信息:"
            file $(which fakeroot)
          else
            echo "❌ fakeroot 安装失败。"
            exit 1
          fi
          # ========== fakeroot 更新结束 ==========

          # 验证其他工具
          echo ""
          echo "其他工具版本："
          command -v ldid && ldid -V || echo "ldid: 未找到"
          command -v dpkg-deb && dpkg-deb --version | head -1 || echo "dpkg-deb: 未找到"

      # ========== 步骤 2: 安装 Theos ==========
      - name: Install Theos
        script: |
          #!/bin/bash
          set -e
          echo "=== [2/6] 安装 Theos ==="

          THEOS_DIR="$THEOS_PATH"

          if [ -d "$THEOS_DIR" ]; then
            echo "Theos 已存在，更新中..."
            cd "$THEOS_DIR" && git pull --rebase || true
          else
            echo "克隆 Theos..."
            mkdir -p "$(dirname "$THEOS_DIR")"
            git clone --recursive https://github.com/theos/theos.git "$THEOS_DIR"
          fi

          # 设置 Theos 环境变量
          echo "export THEOS=$THEOS_DIR" >> ~/.bashrc
          echo "export PATH=\$THEOS/bin:\$PATH" >> ~/.bashrc
          export THEOS=$THEOS_DIR
          export PATH=$THEOS/bin:$PATH

          # 验证 Theos
          echo "Theos 目录: $THEOS_DIR"
          ls -la "$THEOS_DIR/makefiles" | head -5

      # ========== 步骤 3: 准备 iPhone SDK (从网上下载) ==========
      - name: Prepare iPhone SDK
        script: |
          #!/bin/bash
          set -e
          echo "=== [3/6] 准备 iPhone SDK ==="

          export THEOS=$THEOS_PATH
          SDK_DIR="$THEOS/sdks"
          REQUIRED_SDK_VERSION="16.5" 
          SDK_NAME="iPhoneOS${REQUIRED_SDK_VERSION}.sdk"
          TEMP_DIR=$(mktemp -d)

          mkdir -p "$SDK_DIR"

          echo "目标SDK: $SDK_NAME"

          if [ -d "$SDK_DIR/$SDK_NAME" ]; then
            echo "✅ SDK $SDK_NAME 已存在，跳过下载。"
            rm -rf "$TEMP_DIR"
            exit 0
          fi

          echo "📥 下载 SDK..."
          if git clone --depth 1 https://github.com/theos/sdks.git "$TEMP_DIR/sdks"; then
            echo "✅ 仓库克隆成功。"
          else
            echo "❌ 克隆仓库失败。"
            rm -rf "$TEMP_DIR"
            exit 1
          fi

          if [ -d "$TEMP_DIR/sdks/$SDK_NAME" ]; then
            echo "✅ 找到 $SDK_NAME，正在复制..."
            cp -R "$TEMP_DIR/sdks/$SDK_NAME" "$SDK_DIR/"
            echo "✅ SDK 复制完成。"
          else
            echo "❌ 未找到 $SDK_NAME。"
            rm -rf "$TEMP_DIR"
            exit 1
          fi

          rm -rf "$TEMP_DIR"

          if [ -d "$SDK_DIR/$SDK_NAME" ]; then
            echo "✅ SDK $SDK_NAME 准备完成。"
          else
            echo "❌ SDK 准备失败。"
            exit 1
          fi

      # ========== 步骤 4: 编译 Tweak ==========
      - name: Build YouTubiliDanmaku
        script: |
          #!/bin/bash
          set -e
          echo "=== [4/6] 编译 YouTubiliDanmaku ==="

          export THEOS=$THEOS_PATH
          export PATH=$THEOS/bin:$PATH

          PROJECT_DIR="${CM_BUILD_DIR:-$(pwd)}"
          echo "项目目录: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # 显示环境变量（调试用）
          echo "=== 当前环境变量 ==="
          echo "THEOS: $THEOS"
          echo "ARCHS: $ARCHS"
          echo "SDK_VERSION: $SDK_VERSION"
          
          # 验证关键文件
          echo "=== 项目文件 ==="
          ls -la Tweak.x Makefile control *.plist 2>/dev/null || echo "部分文件缺失"

          # 清理旧构建
          echo "清理旧构建..."
          make clean 2>/dev/null || true
          rm -rf packages/ .theos/ obj/ 2>/dev/null || true

          # 编译
          # 注意：ARCHS 已在环境变量中设置为 arm64
          echo "开始编译..."
          make package FINALPACKAGE=1

          # 验证 deb
          echo "=== 编译结果 ==="
          ls -la packages/ 2>/dev/null || {
            echo "❌ packages/ 目录不存在"
            find . -name "*.deb" -o -name "*.dylib" 2>/dev/null
            exit 1
          }

          DEB_FILE=$(ls packages/*.deb 2>/dev/null | head -1)
          if [ -z "$DEB_FILE" ]; then
            echo "❌ 未找到 .deb 文件"
            exit 1
          fi

          echo "✅ 编译成功: $DEB_FILE"
          dpkg-deb --info "$DEB_FILE"

      # ========== 步骤 5: 重命名 deb（带版本号） ==========
      - name: Rename deb package
        script: |
          #!/bin/bash
          set -e
          echo "=== [5/6] 重命名 deb 包 ==="

          PROJECT_DIR="${CM_BUILD_DIR:-$(pwd)}"
          cd "$PROJECT_DIR"

          DEB_FILE=$(ls packages/*.deb 2>/dev/null | head -1)
          if [ -z "$DEB_FILE" ]; then
            echo "❌ 未找到 deb 文件"
            exit 1
          fi

          NEW_NAME="packages/YouTubiliDanmaku_${PACKAGE_VERSION}_iphoneos-arm64.deb"
          cp "$DEB_FILE" "$NEW_NAME"
          echo "✅ 重命名为: $NEW_NAME"
          ls -la packages/

    # ========== 步骤 6: 构建产物 ==========
    artifacts:
      - packages/*.deb
      - .theos/obj/**/*.log
      - .theos/obj/**/*.dylib
