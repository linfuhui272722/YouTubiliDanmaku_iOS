# Codemagic Configuration File
# YouTubiliDanmaku - iOS 越狱插件 (Theos) 自动编译

workflows:
  youTubili-danmaku:
    name: YouTubiliDanmaku Build (Manual Packaging)
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      # 环境变量
      vars:
        # Theos 安装路径
        THEOS_PATH: "/Users/builder/theos"
        # SDK 版本
        SDK_VERSION: "iPhoneOS16.5.sdk"
        # 目标架构
        ARCHS: "arm64"
        # deb 包版本号 (用于重命名)
        PACKAGE_VERSION: "1.0.0"

      # 使用 Xcode 最新版本
      xcode: latest

    # 触发条件
    triggering:
      events:
        - push
        - pull_request
        - tag
      branch_patterns:
        - pattern: main
          include: true
        - pattern: master
          include: true
      cancel_previous_builds: true

    # 缓存 Theos
    cache:
      cache_paths:
        - $THEOS_PATH

    # 构建脚本
    scripts:
      # ========== 步骤 1: 安装依赖 ==========
      - name: Install dependencies
        script: |
          #!/bin/bash
          set -e
          echo "=== [1/6] 安装系统依赖 ==="

          if ! command -v brew &> /dev/null; then
            echo "安装 Homebrew..."
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi

          brew install ldid dpkg || true
          brew install perl || true

          # 尝试更新 fakeroot (虽然本方案不使用它，但保持环境干净总是好的)
          brew uninstall --ignore-dependencies fakeroot || true
          brew cleanup --prune=all -s || true
          brew install fakeroot || brew link --overwrite fakeroot || true

          echo "✅ 依赖安装完成"
          ldid -V || true
          dpkg-deb --version | head -1 || true

      # ========== 步骤 2: 安装 Theos ==========
      - name: Install Theos
        script: |
          #!/bin/bash
          set -e
          echo "=== [2/6] 安装 Theos ==="

          THEOS_DIR="$THEOS_PATH"

          if [ -d "$THEOS_DIR" ]; then
            echo "Theos 已存在，更新中..."
            cd "$THEOS_DIR" && git pull --rebase || true
          else
            echo "克隆 Theos..."
            mkdir -p "$(dirname "$THEOS_DIR")"
            git clone --recursive https://github.com/theos/theos.git "$THEOS_DIR"
          fi

          echo "export THEOS=$THEOS_DIR" >> ~/.bashrc
          echo "export PATH=\$THEOS/bin:\$PATH" >> ~/.bashrc
          export THEOS=$THEOS_DIR
          export PATH=$THEOS/bin:$PATH

          echo "✅ Theos 准备完成"

      # ========== 步骤 3: 准备 iPhone SDK ==========
      - name: Prepare iPhone SDK
        script: |
          #!/bin/bash
          set -e
          echo "=== [3/6] 准备 iPhone SDK ==="

          export THEOS=$THEOS_PATH
          SDK_DIR="$THEOS/sdks"
          REQUIRED_SDK_VERSION="16.5"
          SDK_NAME="iPhoneOS${REQUIRED_SDK_VERSION}.sdk"
          TEMP_DIR=$(mktemp -d)

          mkdir -p "$SDK_DIR"

          if [ -d "$SDK_DIR/$SDK_NAME" ]; then
            echo "✅ SDK $SDK_NAME 已存在，跳过下载。"
            rm -rf "$TEMP_DIR"
            exit 0
          fi

          echo "📥 下载 SDK..."
          if git clone --depth 1 https://github.com/theos/sdks.git "$TEMP_DIR/sdks"; then
             cp -R "$TEMP_DIR/sdks/$SDK_NAME" "$SDK_DIR/" && echo "✅ SDK 复制完成"
          else
             echo "❌ 克隆失败"
             rm -rf "$TEMP_DIR"
             exit 1
          fi

          rm -rf "$TEMP_DIR"
          ls -la "$SDK_DIR/"

      # ========== 步骤 4: 编译与手动打包 (核心修复) ==========
      - name: Build and Manual Package
        script: |
          #!/bin/bash
          set -e
          echo "=== [4/6] 编译与手动打包 (绕过 fakeroot) ==="

          export THEOS=$THEOS_PATH
          export PATH=$THEOS/bin:$PATH

          PROJECT_DIR="${CM_BUILD_DIR:-$(pwd)}"
          echo "项目目录: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # 1. 清理旧构建
          echo "清理旧构建..."
          make clean 2>/dev/null || true
          rm -rf packages/ .theos/obj/ 2>/dev/null || true

          # 2. 执行编译 (仅编译，不打包)
          echo "开始编译 (make all)..."
          make all

          # 3. 查找编译产物
          echo "查找编译产物..."
          DYLIB_FILE=$(find .theos/obj -name "*.dylib" | head -1)
          
          if [ -z "$DYLIB_FILE" ]; then
            echo "❌ 错误：未找到编译生成的 .dylib 文件"
            find .theos -type f
            exit 1
          fi
          echo "✅ 找到 dylib: $DYLIB_FILE"

          # 4. 读取 control 文件获取包信息
          if [ ! -f "control" ]; then
            echo "❌ 错误：未找到 control 文件"
            exit 1
          fi
          
          PACKAGE_ID=$(grep "^Package:" control | awk '{print $2}')
          if [ -z "$PACKAGE_ID" ]; then
            echo "❌ 错误：无法从 control 文件解析 Package ID"
            cat control
            exit 1
          fi
          echo "📦 包 ID: $PACKAGE_ID"

          # 5. 手动创建包目录结构
          STAGE_DIR="packages/$PACKAGE_ID"
          echo "🛠️  创建包目录: $STAGE_DIR"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR/DEBIAN"
          mkdir -p "$STAGE_DIR/Library/MobileSubstrate/DynamicLibraries"

          # 6. 复制文件到包目录
          echo "📄 复制文件..."
          
          # 复制 dylib
          cp "$DYLIB_FILE" "$STAGE_DIR/Library/MobileSubstrate/DynamicLibraries/YouTubiliDanmaku.dylib"
          chmod 0755 "$STAGE_DIR/Library/MobileSubstrate/DynamicLibraries/YouTubiliDanmaku.dylib"
          
          # 复制 plist
          cp "YouTubiliDanmaku.plist" "$STAGE_DIR/Library/MobileSubstrate/DynamicLibraries/"
          chmod 0644 "$STAGE_DIR/Library/MobileSubstrate/DynamicLibraries/YouTubiliDanmaku.plist"
          
          # 复制 control
          cp "control" "$STAGE_DIR/DEBIAN/control"
          chmod 0644 "$STAGE_DIR/DEBIAN/control"
          
          # 如果有 extras 脚本，也可以在这里复制
          # cp extras/postinst "$STAGE_DIR/DEBIAN/postinst" && chmod 0755 "$STAGE_DIR/DEBIAN/postinst"

          # 7. 手动打包 (直接调用 dpkg-deb，无需 fakeroot)
          echo "📦 正在打包..."
          dpkg-deb -b "$STAGE_DIR" "$STAGE_DIR.deb"

          # 8. 验证
          if [ -f "$STAGE_DIR.deb" ]; then
            echo "✅ 构建成功: $STAGE_DIR.deb"
            ls -lh "$STAGE_DIR.deb"
            dpkg-deb --info "$STAGE_DIR.deb"
          else
            echo "❌ 打包失败"
            exit 1
          fi

      # ========== 步骤 5: 重命名 deb ==========
      - name: Rename deb package
        script: |
          #!/bin/bash
          set -e
          echo "=== [5/6] 重命名 deb 包 ==="

          PROJECT_DIR="${CM_BUILD_DIR:-$(pwd)}"
          cd "$PROJECT_DIR"

          # 查找刚才生成的 deb 文件
          DEB_FILE=$(ls packages/*.deb 2>/dev/null | grep -v "iphoneos-arm" | head -1)
          
          if [ -z "$DEB_FILE" ]; then
            echo "❌ 未找到 deb 文件"
            exit 1
          fi

          NEW_NAME="packages/YouTubiliDanmaku_${PACKAGE_VERSION}_iphoneos-arm64.deb"
          cp "$DEB_FILE" "$NEW_NAME"
          echo "✅ 重命名为: $NEW_NAME"
          ls -la packages/

    # ========== 步骤 6: 构建产物 ==========
    artifacts:
      - packages/*.deb
      - .theos/obj/**/*.log
      - .theos/obj/**/*.dylib
